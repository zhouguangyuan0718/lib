# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.20'

    - name: Build
      run: go build -v ./...

  llgo-test:
    name: llgo-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
        - windows-2022
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.7'

    # Windows test execution became available through LLGo R6. Build current
    # LLGo main independently of this module, then exercise only the basic C
    # bindings available at that stage. Later LLGo stages expand this lane to
    # the full synchronization and C++ ABI surface.
    - name: Check out LLGo
      uses: actions/checkout@v4
      with:
        repository: xgo-dev/llgo
        ref: main
        path: .llgo

    - name: Set up LLGo dependencies
      uses: ./.llgo/.github/actions/setup-deps
      with:
        llvm-version: '19'

    - name: Build LLGo
      if: runner.os != 'Windows'
      working-directory: .llgo
      run: go build -tags=dev -o "$RUNNER_TEMP/llgo" ./cmd/llgo

    - name: Test LLGo native bindings
      if: runner.os != 'Windows'
      env:
        LLGO_BUILD_CACHE: 'off'
        LLGO_ROOT: ${{ github.workspace }}/.llgo
      run: |
        "$RUNNER_TEMP/llgo" test -v ./c/pthread/sync
        "$RUNNER_TEMP/llgo" run ./c/bdwgc/_test 0

    # The Unix binding exposes libc++'s C++ ABI and is therefore exercised on
    # macOS. Linux LLVM packages use libstdc++; Windows is tested below through
    # its stable C bridge.
    - name: Test LLGo LLVM demangle bindings
      if: runner.os == 'macOS'
      env:
        LLGO_BUILD_CACHE: 'off'
        LLGO_ROOT: ${{ github.workspace }}/.llgo
      run: |
        "$RUNNER_TEMP/llgo" test -v ./cpp/llvm

    - name: Build LLGo on Windows
      if: runner.os == 'Windows'
      working-directory: .llgo
      shell: pwsh
      run: go build -tags=dev -o "$env:RUNNER_TEMP\llgo.exe" ./cmd/llgo

    - name: Test LLGo Windows bindings and demos
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        LLGO_BUILD_CACHE: 'off'
        LLGO_REQUIRE_MSVC: '1'
        LLGO_ROOT: ${{ github.workspace }}/.llgo
      run: |
        $ErrorActionPreference = "Stop"
        $llgo = Join-Path $env:RUNNER_TEMP "llgo.exe"

        & $llgo test -count=1 -v ./c/net
        if ($LASTEXITCODE -ne 0) {
          exit $LASTEXITCODE
        }
        & $llgo run ./c/bdwgc/_test 0
        if ($LASTEXITCODE -ne 0) {
          exit $LASTEXITCODE
        }

        Push-Location .llgo
        try {
          go mod edit "-replace=github.com/goplus/lib=$env:GITHUB_WORKSPACE"
          foreach ($demo in @(
            "hello",
            "crand",
            "ctime",
            "getcwd",
            "setjmp",
            "netdbdemo",
            "thread"
          )) {
            Write-Host "Running Windows C demo: $demo"
            & $llgo run "./_demo/c/$demo"
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }
        } finally {
          Pop-Location
        }
